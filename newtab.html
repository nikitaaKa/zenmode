<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZenMode</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="zen-newtab">
    <section class="zen-newtab-content">
      <div class="zen-newtab-mark">z</div>
      <h1>Take a breath.</h1>
      <p id="zen-quote">A quieter starting point for the next thing you want to make, read, or understand.</p>
      
      <div class="zen-mode-selector" role="tablist">
        <button type="button" class="zen-mode-btn is-active" data-mode="search" role="tab" aria-selected="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Google Search
        </button>
        <button type="button" class="zen-mode-btn" data-mode="ai" role="tab" aria-selected="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path></svg>
          Google Search (AI Mode)
        </button>
        <button type="button" class="zen-mode-btn" data-mode="gemini" role="tab" aria-selected="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path></svg>
          Gemini
        </button>
      </div>

      <form class="zen-newtab-search" autocomplete="off">
        <span class="zen-search-icon" id="search-mode-icon">&#9679;</span>
        <input type="search" placeholder="Search the web or type a URL..." aria-label="Query" autofocus>
        <button type="submit" class="zen-search-submit" title="Go" aria-label="Submit">&#8594;</button>
      </form>
    </section>
  </main>
  <script src="content.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
